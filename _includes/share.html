<div class="share sticky-top sticky-top-offset">
    <p>
        Share
    </p>
    <ul>
        <li class="ml-1 mr-1">
            <a target="_blank" rel="noopener noreferrer" href="https://twitter.com/intent/tweet?text={{ page.title }}&url={{ page.url | absolute_url }}" onclick="window.open(this.href, 'twitter-share', 'width=550,height=235');return false;" aria-label="Share on X" title="Share on X">
                <span class="share-icon">X</span>
            </a>
        </li>

        <li class="ml-1 mr-1">
            <a target="_blank" rel="noopener noreferrer" href="https://facebook.com/sharer.php?u={{ page.url | absolute_url }}" onclick="window.open(this.href, 'facebook-share', 'width=550,height=435');return false;" aria-label="Share on Facebook" title="Share on Facebook">
                <span class="share-icon">f</span>
            </a>
        </li>

        <li class="ml-1 mr-1">
            <a target="_blank" rel="noopener noreferrer" href="https://www.linkedin.com/shareArticle?mini=true&url={{ page.url | absolute_url }}" onclick="window.open(this.href, 'width=550,height=435');return false;" aria-label="Share on LinkedIn" title="Share on LinkedIn">
                <span class="share-icon">in</span>
            </a>
        </li>

    </ul>
    {% if page.comments != false %}
    <div class="sep">
    </div>
    <ul>
        <li>
        <a class="small smoothscroll" href="#disqus_thread" aria-label="Jump to comments">
            <span class="sr-only">Comments</span>
        </a>
        </li>
    </ul>
    {% endif %}
</div>
